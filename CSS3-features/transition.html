<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition</title>
    <style>
        .box {
            width: 100px;
            height: 100px;
            border: 2px solid tomato;
            background-color: palegoldenrod;
            /* Property name | duration | easing function | delay */
            /* transition: width 5s linear 3s, background-color 5s ease-in 3s; */
            transition: transform 5s; /* time 7sec delay 2sec */
        }

        .box:hover {
            /* width: 400px;
            background-color: red; */
            transform: rotate(45deg) scale(1.5) translateX(150px);
        }
    </style>
</head>
<body>
    <ul>
        <li>Transform: change the shape. This is a CSS style property name</li>
        <li>Translate: It is a value of transform style value, this means you move either x or yor both axis</li>
        <li>Transition: How long you will take to do the change of the shape or color.</li>
    </ul>
    <div class="box">Box-1</div>
    <div class="box">Box-2</div>
    <div class="box">Box-3</div>

</body>

</html>
